name: Build and publish Android bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Optional: retry publishing the saved bundle from a previous main-branch run"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: alarmpro-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Signed bundle to Internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate unique Android version
        shell: bash
        run: |
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          BASE_VERSION=$(sed -n 's/.*versionName = ciVersionName.orNull ?: "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test -n "$BASE_VERSION"
          echo "VERSION_NAME=${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Validate saved bundle source
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        shell: bash
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e '.head_branch == "main" and .event == "push" and .path == ".github/workflows/android-play-release.yml" and .status == "completed"' "$RUNNER_TEMP/source-run.json"
          SOURCE_RUN_NUMBER=$(jq -r '.run_number' "$RUNNER_TEMP/source-run.json")
          echo "VERSION_CODE=$((100000 + SOURCE_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Download saved signed bundle
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: alarmpro-${{ env.VERSION_CODE }}
          path: app/build/outputs/bundle/release
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alarmpro-upload-key.jks"

      - name: Build signed release bundle
        if: inputs.artifact_run_id == ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/alarmpro-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          bash ./gradlew :app:bundleRelease
          -PciVersionCode="$VERSION_CODE"
          -PciVersionName="$VERSION_NAME"
          --console=plain

      - name: Upload signed bundle artifact
        if: inputs.artifact_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: alarmpro-${{ env.VERSION_CODE }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - id: google-auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: project-33477e16-5086-4c11-933
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Publish bundle to Google Play Internal testing
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/alarmpro-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          bash ./gradlew :app:publishReleaseBundle
          --artifact-dir app/build/outputs/bundle/release
          --track internal
          --release-status completed
          -PciVersionCode="$VERSION_CODE"
          -PciVersionName="$VERSION_NAME"
          --console=plain
